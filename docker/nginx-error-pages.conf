# DGS-branded pages for the errors Nginx answers itself, before Laravel runs: 403 for blocked files (/.env, /.git…),
# 404 for missing static files, 413 for uploads over client_max_body_size, 502/504 when PHP-FPM is down or too slow.
# Errors from Laravel keep Laravel's own pages (resources/views/errors): fastcgi_intercept_errors stays off.
#
# The pages are public/errors/*.html, built from those views by `php artisan errors:static`.
# Included in the site's server block as /etc/nginx/snippets/dgs-error-pages.conf: installed by
# deploy/aws/deploy.sh on the Lightsail server, copied in by the Dockerfile.

error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 413 /errors/413.html;
error_page 500 /errors/500.html;
error_page 502 /errors/502.html;
error_page 503 /errors/503.html;
error_page 504 /errors/504.html;

# Only reachable through error_page; opening /errors/… directly is a 404.
location ^~ /errors/ {
    internal;
    add_header Cache-Control "no-store" always;
}
