# __PORT__ is replaced by $PORT in docker/start.sh. TLS is terminated by Render's proxy.
server {
    listen __PORT__ default_server;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.png { access_log off; log_not_found off; }
    # robots.txt and sitemap.xml are generated by Laravel (indexing switch in Settings).
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }
    location = /up          { access_log off; try_files $uri /index.php?$query_string; }

    # Customer app download: the Android type makes phones offer to install it; no-cache so a new APK shows up at once.
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
