<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1F1B13">
    <title>Something went wrong · DGS Hair Salon &amp; Spa</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --gold: #F0B800;
            --ink: #1F1B13;
            --surface: #FFFBF5;
            --outline: #D2C5B4;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            background: var(--ink);
            color: #fff;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; }

        .header { background: var(--surface); border-bottom: 1px solid color-mix(in srgb, var(--outline) 60%, transparent); color: var(--ink); }
        .header-inner { max-width: 72rem; margin: 0 auto; padding: 0.75rem 1rem; }
        .brand { display: inline-flex; align-items: center; gap: 0.75rem; font-weight: 600; text-decoration: none; }
        .brand img { width: 2.5rem; height: 2.5rem; border-radius: 0.75rem; display: block; }

        .hero { position: relative; flex: 1; display: flex; align-items: center; overflow: hidden; }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 10%, #F0B80066, transparent 55%),
                radial-gradient(circle at 90% 100%, #7A590088, transparent 50%);
        }
        .content { position: relative; width: 100%; max-width: 40rem; margin: 0 auto; padding: 3.5rem 1rem 4rem; text-align: center; }
        .code {
            margin: 0;
            font-size: clamp(6rem, 30vw, 11rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            /* The metallic gold of the DGS loyalty card. */
            background: linear-gradient(180deg, #F6DC8C 0%, #DDB54A 45%, #A87A12 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { margin: 1.25rem 0 0; font-size: clamp(1.75rem, 6vw, 2.5rem); font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
        .message { margin: 1rem auto 0; max-width: 32rem; font-size: 1.125rem; line-height: 1.6; color: rgb(255 255 255 / 0.8); }
        .actions { margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 3rem;
            padding: 0 1.5rem;
            border-radius: 999px;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .button svg { width: 1.25rem; height: 1.25rem; flex: none; }
        .button-primary { background: #fff; color: var(--ink); border: 0; }
        .button-primary:hover { background: rgb(255 255 255 / 0.9); }
        .button-outline { background: transparent; color: #fff; border: 1px solid rgb(255 255 255 / 0.4); font-weight: 500; }
        .button-outline:hover { background: rgb(255 255 255 / 0.1); }
        .button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
        .ref { margin: 2.5rem 0 0; font-size: 0.875rem; color: rgb(255 255 255 / 0.55); }

        @media (max-width: 30rem) {
            .actions { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="/">
                <img src="/images/dgs-logo-256.png" alt="" width="40" height="40">
                <span>DGS Hair Salon &amp; Spa</span>
            </a>
        </div>
    </header>

    <main class="hero">
        <div class="content">
            <p class="code" aria-hidden="true">500</p>
            <h1>Something went wrong</h1>
            <p class="message">It’s not you, it’s us. Please try again in a few minutes.</p>

            <div class="actions">
                <a class="button button-primary" href="/">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    Go to home page
                </a>
                                    <a class="button button-outline" href="" onclick="location.reload(); return false;">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
                        Try again
                    </a>
                            </div>

            <p class="ref">Error 500</p>
        </div>
    </main>
</body>
</html>
